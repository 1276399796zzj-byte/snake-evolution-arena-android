name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game data
        run: node scripts/validate-game-data.mjs
      - name: Configure C++ host tests
        run: cmake -S native -B build/host -DSNAKE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ host tests
        run: cmake --build build/host --parallel 2
      - name: Run C++ host tests
        run: ctest --test-dir build/host --output-on-failure

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify versions
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed
      - name: Lint, unit test and assemble debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify ARM64 renderer payload
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          native_lib="$RUNNER_TEMP/libsnake_engine.so"
          entries="$RUNNER_TEMP/apk-entries.txt"
          dynamic="$RUNNER_TEMP/native-dynamic.txt"
          symbols="$RUNNER_TEMP/native-symbols.txt"
          test -f "$apk"
          unzip -Z1 "$apk" > "$entries"
          test "$(awk '/^lib\// && !/^lib\/arm64-v8a\// { count++ } END { print count + 0 }' "$entries")" -eq 0
          grep -q '^lib/arm64-v8a/libsnake_engine.so$' "$entries"
          grep -q '^assets/maps/map-neon.jpg$' "$entries"
          grep -q '^assets/maps/map-wilds.jpg$' "$entries"
          grep -q '^assets/maps/map-lab.jpg$' "$entries"
          unzip -p "$apk" lib/arm64-v8a/libsnake_engine.so > "$native_lib"
          readelf -d "$native_lib" > "$dynamic"
          nm -D "$native_lib" > "$symbols"
          grep -q 'libvulkan.so' "$dynamic"
          grep -q 'NativeBridge_createVulkanRenderer' "$symbols"
          grep -q 'NativeBridge_renderVulkan' "$symbols"
          grep -q 'NativeBridge_vulkanSupportLevel' "$symbols"
      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-evolution-arena-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

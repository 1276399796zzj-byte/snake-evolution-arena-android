let frame=0;function animate(){requestAnimationFrame(animate);let dt=Math.min(.04,clock.getDelta()),t=clock.elapsedTime;let ax=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+joy.x,az=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)+joy.y,len=Math.hypot(ax,az),speed=0;
if(playing){if(keys.has('Space')&&player.y<.03)player.vy=5.7;if(len>.1){ax/=Math.max(1,len);az/=Math.max(1,len);let dx=ax*Math.cos(yaw)+az*Math.sin(yaw),dz=az*Math.cos(yaw)-ax*Math.sin(yaw);speed=(running||keys.has('ShiftLeft')?7:4)*Math.min(1,len);let x=T.MathUtils.clamp(player.x+dx*speed*dt,-48,48),z=T.MathUtils.clamp(player.z+dz*speed*dt,-28,47);for(let b of blockers){let d=Math.hypot(x-b.x,z-b.z),r=b.r+.36;if(d<r){let a=Math.atan2(z-b.z,x-b.x);x=b.x+r*Math.cos(a);z=b.z+r*Math.sin(a)}}player.x=x;player.z=z;let a=Math.atan2(dx,dz);player.heading+=Math.atan2(Math.sin(a-player.heading),Math.cos(a-player.heading))*Math.min(1,dt*12);step+=dt*speed*1.8}player.vy-=13*dt;player.y=Math.max(0,player.y+player.vy*dt);if(!player.y)player.vy=0;girl.position.set(player.x,player.y,player.z);girl.rotation.y=player.heading;torso.position.y=Math.sin(t*2)*.018+Math.abs(Math.sin(step*2))*.048*(speed/4);for(let o of legs)o.l.rotation.x=Math.sin(step*2)*.5*(speed/4)*o.sign;for(let o of arms)o.a.rotation.x=-Math.sin(step*2)*.4*(speed/4)*o.sign;target.set(player.x,player.y+1.6,player.z);desired.set(player.x-Math.sin(yaw)*Math.cos(pitch)*dist,player.y+1.65+Math.sin(pitch)*dist,player.z-Math.cos(yaw)*Math.cos(pitch)*dist);camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(target);$('#location').textContent=player.z>27?'古社神域':player.x< -10?'镜月池畔':player.x>11?'风铃凉亭':player.z>10?'朱红鸟居':'落樱参道';$('#interact').style.display=Math.hypot(player.x-5,player.z-4)<3?'block':'none';for(let star of stars){if(!star.active)continue;star.g.position.y=1.4+Math.sin(t*2+star.phase)*.2;star.halo.rotation.y+=dt;if(Math.hypot(player.x-star.x,player.z-star.z)<1.25){star.active=false;scene.remove(star.g);score++;$('#count').textContent=score;$('#quest').textContent=score===8?'✦ 旅途完成 · 星辉齐聚':'✦ 寻找星辉　'+score+' / 8';toast(score===8?'✧ 恭喜！你找回了全部八枚星辉':'✦ 收集到星辉 '+score+' / 8')}}}else{camera.position.lerp(new T.Vector3(-8,11,-28),.06);camera.lookAt(0,2,8)}
for(let i=0;i<petalCount;i++){let q=particles[i];q.y-=dt*q.v;q.x+=Math.sin(t*.6+q.angle)*dt*.23;q.z+=dt*.17;if(q.y<.1){q.y=R(7,13);q.x=R(-28,30);q.z=R(-24,44)}dummy.position.set(q.x,q.y,q.z);dummy.rotation.set(q.angle+t*.4,q.angle+t*.3,t*.45);dummy.scale.setScalar(.7);dummy.updateMatrix();petalMesh.setMatrixAt(i,dummy.matrix)}petalMesh.instanceMatrix.needsUpdate=true;for(let [i,r] of ripples.entries())r.scale.setScalar(.6+((t*.2+i*.15)%1)*.8);renderer.render(scene,camera);if(++frame%8===0)minimap()}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
